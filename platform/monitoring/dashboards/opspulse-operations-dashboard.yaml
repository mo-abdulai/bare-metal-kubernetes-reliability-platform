apiVersion: v1
kind: ConfigMap
metadata:
  name: opspulse-operations-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: opspulse-operations-dashboard
    app.kubernetes.io/part-of: bare-metal-kubernetes-reliability-platform
data:
  opspulse-operations.json: |-
    {
      "uid": "opspulse-bare-metal-ops",
      "title": "OpsPulse — Bare-Metal Kubernetes Operations",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "timezone": "browser",
      "tags": ["opspulse", "bare-metal", "k3s"],
      "time": { "from": "now-1h", "to": "now" },
      "templating": { "list": [] },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Ready Nodes",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [{ "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "refId": "A" }]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Unavailable Nodes",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "targets": [{ "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"} == 0)", "refId": "A" }]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Running Pods",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "targets": [{ "expr": "sum(kube_pod_status_phase{phase=\"Running\"})", "refId": "A" }]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Pending or Failed Pods",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "targets": [{ "expr": "sum(kube_pod_status_phase{phase=~\"Pending|Failed\"})", "refId": "A" }]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Node CPU Utilization %",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 4 },
          "fieldConfig": { "defaults": { "unit": "percent" }, "overrides": [] },
          "targets": [{ "expr": "100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))", "legendFormat": "{{instance}}", "refId": "A" }]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Node Memory Utilization %",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 4 },
          "fieldConfig": { "defaults": { "unit": "percent" }, "overrides": [] },
          "targets": [{ "expr": "100 * (1 - ((node_memory_MemAvailable_bytes or node_memory_MemFree_bytes) / node_memory_MemTotal_bytes))", "legendFormat": "{{instance}}", "refId": "A" }]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Filesystem Utilization %",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 4 },
          "fieldConfig": { "defaults": { "unit": "percent" }, "overrides": [] },
          "targets": [{ "expr": "max by (instance, mountpoint) (100 * (1 - (node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|squashfs|proc|sysfs|devtmpfs\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay|squashfs|proc|sysfs|devtmpfs\"})))", "legendFormat": "{{instance}} {{mountpoint}}", "refId": "A" }]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Container Restarts",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 12 },
          "targets": [{ "expr": "kube_pod_container_status_restarts_total{namespace=\"opspulse\"}", "legendFormat": "{{pod}}/{{container}}", "refId": "A" }]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Deployment Desired vs Available",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 12 },
          "targets": [
            { "expr": "kube_deployment_spec_replicas{namespace=\"opspulse\"}", "legendFormat": "{{deployment}} desired", "refId": "A" },
            { "expr": "kube_deployment_status_replicas_available{namespace=\"opspulse\"}", "legendFormat": "{{deployment}} available", "refId": "B" }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "OpsPulse API Request Rate",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 12 },
          "targets": [{ "expr": "sum(rate(opspulse_api_http_requests_total[5m])) by (status_code)", "legendFormat": "{{status_code}}", "refId": "A" }]
        },
        {
          "id": 11,
          "type": "stat",
          "title": "OpsPulse API Metrics Target",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 20 },
          "targets": [{ "expr": "up{job=\"opspulse-api\"}", "refId": "A" }]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "OpsPulse API p95 Duration",
          "gridPos": { "h": 6, "w": 18, "x": 6, "y": 20 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(opspulse_api_http_request_duration_seconds_bucket[5m])) by (le))", "refId": "A" }]
        }
      ]
    }
