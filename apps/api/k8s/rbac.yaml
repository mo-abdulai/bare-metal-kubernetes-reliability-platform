apiVersion: v1
kind: ServiceAccount
metadata:
  name: opspulse-api
  namespace: opspulse
  labels:
    app: opspulse-api
    app.kubernetes.io/name: opspulse-api
    app.kubernetes.io/component: backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opspulse-api-readonly
  labels:
    app.kubernetes.io/name: opspulse-api
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opspulse-api-readonly
  labels:
    app.kubernetes.io/name: opspulse-api
subjects:
  - kind: ServiceAccount
    name: opspulse-api
    namespace: opspulse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opspulse-api-readonly
