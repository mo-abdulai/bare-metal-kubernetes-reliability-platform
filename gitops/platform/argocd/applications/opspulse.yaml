apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opspulse
  namespace: argocd
  labels:
    app.kubernetes.io/name: opspulse
    app.kubernetes.io/part-of: bare-metal-kubernetes-reliability-platform
spec:
  project: default
  source:
    repoURL: git@github.com:mo-abdulai/bare-metal-kubernetes-reliability-platform.git
    targetRevision: main
    path: gitops/apps/opspulse/overlays/bare-metal
  destination:
    server: https://kubernetes.default.svc
    namespace: opspulse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
