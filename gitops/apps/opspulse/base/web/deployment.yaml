apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspulse-web
  namespace: opspulse
  labels:
    app.kubernetes.io/name: opspulse-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: bare-metal-kubernetes-reliability-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: opspulse-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opspulse-web
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: opspulse-web
          image: opspulse-web
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: opspulse-web-config
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
