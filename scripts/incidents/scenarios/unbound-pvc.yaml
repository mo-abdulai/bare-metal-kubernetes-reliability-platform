apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opspulse-chaos-unbound-pvc
  namespace: opspulse-chaos
  labels:
    opspulse.io/incident-test: "true"
    opspulse.io/scenario: "unbound-pvc"
  annotations:
    opspulse.io/purpose: "incident-reproduction"
    opspulse.io/runbook: "unbound-pvc"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: opspulse-chaos-storageclass-does-not-exist
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: opspulse-chaos-unbound-pvc
  namespace: opspulse-chaos
  labels:
    opspulse.io/incident-test: "true"
    opspulse.io/scenario: "unbound-pvc"
  annotations:
    opspulse.io/purpose: "incident-reproduction"
    opspulse.io/runbook: "unbound-pvc"
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          cpu: 20m
          memory: 32Mi
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: opspulse-chaos-unbound-pvc
