apiVersion: v1
kind: ResourceQuota
metadata:
  name: opspulse-chaos-resource-quota
  namespace: opspulse-chaos
  labels:
    opspulse.io/incident-test: "true"
    opspulse.io/scenario: "resource-quota"
  annotations:
    opspulse.io/purpose: "incident-reproduction"
    opspulse.io/runbook: "resource-quota"
spec:
  hard:
    pods: "0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspulse-chaos-resource-quota
  namespace: opspulse-chaos
  labels:
    opspulse.io/incident-test: "true"
    opspulse.io/scenario: "resource-quota"
  annotations:
    opspulse.io/purpose: "incident-reproduction"
    opspulse.io/runbook: "resource-quota"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opspulse-chaos-resource-quota
  template:
    metadata:
      labels:
        app: opspulse-chaos-resource-quota
        opspulse.io/incident-test: "true"
        opspulse.io/scenario: "resource-quota"
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 20m
              memory: 32Mi
