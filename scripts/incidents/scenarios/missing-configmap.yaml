apiVersion: v1
kind: Pod
metadata:
  name: opspulse-chaos-missing-configmap
  namespace: opspulse-chaos
  labels:
    opspulse.io/incident-test: "true"
    opspulse.io/scenario: "missing-configmap"
  annotations:
    opspulse.io/purpose: "incident-reproduction"
    opspulse.io/runbook: "missing-configmap"
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      envFrom:
        - configMapRef:
            name: opspulse-chaos-configmap-does-not-exist
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          cpu: 20m
          memory: 32Mi
