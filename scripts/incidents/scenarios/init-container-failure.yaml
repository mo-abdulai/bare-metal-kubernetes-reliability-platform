apiVersion: v1
kind: Pod
metadata:
  name: opspulse-chaos-init-container-failure
  namespace: opspulse-chaos
  labels:
    opspulse.io/incident-test: "true"
    opspulse.io/scenario: "init-container-failure"
  annotations:
    opspulse.io/purpose: "incident-reproduction"
    opspulse.io/runbook: "init-container-failure"
spec:
  restartPolicy: Always
  initContainers:
    - name: failing-init
      image: busybox:1.36
      command: ["sh", "-c", "echo 'opspulse init container failure reproduction'; exit 7"]
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          cpu: 20m
          memory: 32Mi
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          cpu: 20m
          memory: 32Mi
