apiVersion: v1
kind: Pod
metadata:
  name: opspulse-chaos-node-affinity
  namespace: opspulse-chaos
  labels:
    opspulse.io/incident-test: "true"
    opspulse.io/scenario: "node-affinity"
  annotations:
    opspulse.io/purpose: "incident-reproduction"
    opspulse.io/runbook: "node-affinity"
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: opspulse.io/nonexistent-node-label
                operator: In
                values:
                  - required-for-safe-reproduction
  containers:
    - name: pending
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          cpu: 20m
          memory: 32Mi
