  mode: "automatic"
node-affinity:
  title: "Node Affinity Failure"
  expected_state: "Pod remains Pending due to node affinity mismatch"
  prometheus_signal: "kube_pod_status_phase reports Pending"
  loki_signal: "FailedScheduling event explains affinity mismatch"
  runbook: "node-affinity"
  cleanup: "delete scenario manifest resources"
  mode: "automatic"
node-taint:
  title: "Node Taint Scheduling Failure"
  expected_state: "Manual-only scheduler failure demonstration"
  prometheus_signal: "manual-only"
  loki_signal: "manual-only"
  runbook: "node-taint"
  cleanup: "no automatic resources"
  mode: "manual-only"
resource-quota:
  title: "Resource Quota Failure"
  expected_state: "Kubernetes API rejects workload because namespace quota is exceeded"
  prometheus_signal: "kube_resourcequota reports hard and used values"
  loki_signal: "kubectl/API error explains quota limit"
  runbook: "resource-quota"
  cleanup: "delete scenario manifest resources"
  mode: "automatic"
insufficient-resources:
  title: "Insufficient Resources"
  expected_state: "Pod remains Pending due to impossible resource request"
  prometheus_signal: "kube_pod_status_phase reports Pending"
  loki_signal: "FailedScheduling event reports insufficient CPU or memory"
  runbook: "insufficient-resources"
  cleanup: "delete scenario manifest resources"
  mode: "automatic"
unbound-pvc:
  title: "Unbound PVC"
  expected_state: "PVC and Pod remain Pending because StorageClass is unavailable"
  prometheus_signal: "kube_persistentvolumeclaim_status_phase reports Pending"
  loki_signal: "Kubernetes event reports unbound PVC"
  runbook: "unbound-pvc"
  cleanup: "delete scenario manifest resources"
  mode: "automatic"
init-container-failure:
  title: "Init Container Failure"
  expected_state: "Init container enters CrashLoopBackOff and app container never starts"
  prometheus_signal: "init container restart/waiting metrics change"
  loki_signal: "init container logs explain deterministic failure"
  runbook: "init-container-failure"
  cleanup: "delete scenario manifest resources"
  mode: "automatic"
runtime-error:
  title: "Runtime Error"
  expected_state: "Application starts, logs an error, and restarts"
  prometheus_signal: "restart counter increases"
  loki_signal: "application log contains deterministic runtime exception"
  runbook: "runtime-error"
  cleanup: "delete scenario manifest resources"
  mode: "automatic"
argocd-drift:
  title: "Argo CD Drift Detection"
  expected_state: "Manual replica drift is restored by Argo CD self-heal"
  prometheus_signal: "deployment replica state changes and recovers"
  loki_signal: "Argo CD Application events show reconciliation"
  runbook: "argocd-out-of-sync"
  cleanup: "Argo CD self-heal restores Git desired state"
  mode: "manual-only"
