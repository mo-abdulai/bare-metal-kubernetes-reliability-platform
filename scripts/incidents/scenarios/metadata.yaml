crashloopbackoff:
  title: "CrashLoopBackOff"
  expected_state: "Pod enters CrashLoopBackOff and restart count increases"
  prometheus_signal: "kube_pod_container_status_restarts_total increases"
  loki_signal: "container logs and Kubernetes BackOff events"
  runbook: "crashloopbackoff"
  cleanup: "delete scenario manifest resources"
  mode: "automatic"
imagepullbackoff:
  title: "ImagePullBackOff"
  expected_state: "Pod waits with ErrImagePull or ImagePullBackOff"
  prometheus_signal: "kube_pod_container_status_waiting_reason reports image pull state"
  loki_signal: "Kubernetes Warning events explain failed image pull"
  runbook: "imagepullbackoff"
  cleanup: "delete scenario manifest resources"
  mode: "automatic"
oomkilled:
  title: "OOMKilled"
  expected_state: "Container restart with OOMKilled reason"
  prometheus_signal: "restart counter increases and memory limit is visible"
  loki_signal: "container logs before termination and Kubernetes restart evidence"
  runbook: "oomkilled"
  cleanup: "delete scenario manifest resources"
  mode: "automatic"
